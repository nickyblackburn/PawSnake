<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Snake Arena UwU</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif;
             background:#0f1220; color:#e9ecf1; display:flex; gap:24px; padding:20px; }
      .panel { background:#171a2b; border:1px solid #2a2e45; border-radius:16px; padding:16px;
               box-shadow:0 10px 30px rgba(0,0,0,0.4); }
      #game { display:flex; flex-direction:column; align-items:center; gap:8px; }
      canvas { background:#0a0d1a; border:1px solid #2a2e45; border-radius:12px; image-rendering: pixelated; }
      input, button, select { background:#232744; color:#e9ecf1; border:1px solid #2f3558; padding:8px 12px; border-radius:10px; }
      button:hover { filter:brightness(1.1) }
      .controls { display:flex; gap:12px; flex-wrap:wrap; }
      .legend { display:flex; gap:12px; }
      .dot { width:12px; height:12px; border-radius:2px; display:inline-block; }
      .msg { min-height: 1.5em; }
      .confetti-overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 30; background: transparent; }
      .modal.hidden { display:none; }
      .modal { position: fixed; inset:0; display:grid; place-items:center; background: rgba(0,0,0,0.35); z-index: 40; }
      .modal-card { min-width: 280px; max-width: 420px; background: #171a2b; color: #e9ecf1;
                    border:1px solid #2a2e45; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.6);
                    padding:18px 20px; text-align:center; }
      .modal-card h3 { margin:0 0 8px; font-size:20px; }
      .result-text { font-size:22px; margin:6px 0 16px; }
      .modal-actions { display:flex; gap:10px; justify-content:center; }
      .modal-actions button { background:#232744; color:#e9ecf1; border:1px solid #2f3558; padding:8px 14px; border-radius:10px; cursor:pointer; }
      .modal-actions button:hover { filter:brightness(1.1); }
      .modal-actions .ghost { background: transparent; }
    </style>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  </head>
  <body>
    <div class="panel" id="config">
      <h2>🐍 Snake Arena — by Nicky Blackburn 💜</h2>
      <div class="controls">
        <label>Mode:</label>
        <select id="mode"><option value="ai">vs AI</option><option value="pvp">Player vs Player</option></select>
        <label>Room:</label>
        <input id="room" placeholder="(auto)" />
      </div>
      <div class="controls">
        <button id="create">Create Room</button>
        <button id="join">Join Room</button>
        <button id="copy">Copy Room Link</button>
      </div>
      <div class="msg" id="status"></div>
    </div>

    <div class="panel" id="game">
      <canvas id="c" width="900" height="600"></canvas>
      <div class="legend">
        <span><span class="dot" style="background:#8be9fd"></span>P1</span>
        <span><span class="dot" style="background:#ff79c6"></span>P2 / AI</span>
        <span><span class="dot" style="background:#50fa7b"></span>Food</span>
      </div>
      <div id="over" class="msg"></div>
    </div>

    <canvas id="confetti" class="confetti-overlay"></canvas>
    <div id="resultModal" class="modal hidden">
      <div class="modal-card">
        <h3 id="resultTitle">Result</h3>
        <p id="resultText" class="result-text">YOU WIN!</p>
        <div class="modal-actions">
          <button id="restartBtn">Restart</button>
          <button id="closeBtn" class="ghost">Close</button>
        </div>
      </div>
    </div>

    <script src="/static/game.js"></script>
  </body>
</html>
